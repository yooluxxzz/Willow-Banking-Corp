name: Refresh saved market prices

# Saves real, delayed prices to src/content/market-snapshot.json, which Willow uses
# only when live prices can't be retrieved. Run it from the Actions tab before a demo.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/save-market-prices.js']

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/save-market-prices.js
      - name: Commit the snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain -- src/content/market-snapshot.json)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/market-snapshot.json
          git commit -m "Refresh saved market prices"
          git push
